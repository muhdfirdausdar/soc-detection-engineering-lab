
[auth_detection_fields]
definition = _time agentName alertId ruleId alertTitle severity  user Account_Name Account_Domain Subject_Account_Name Subject_Account_Domain Target_Account_Name Target_Account_Domain ComputerName src_ip Logon_Type Logon_Process Authentication_Package Process_ID Process_Name EventCode RecordNumber mitreTactic mitreTechniqueId mitreTechniqueName timestamp rawLog
iseval = 0

[soc_common_fields]
definition = eval alertId=tostring(round(_time*1000,0)).".".substr(tostring(random()),1,6)\
| eval ms=printf("%03d", round((_time-floor(_time))*1000))\
| eval timestamp=strftime(_time,"%Y-%m-%d %I:%M:%S").".".ms." ".strftime(_time,"%p")\
| eval agentName=host\
| eval rawLog=_raw
iseval = 0

