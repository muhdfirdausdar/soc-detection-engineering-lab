services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n

    ports:
      - "10.20.30.10:5678:5678"

    environment:
      - TZ=Asia/Kuala_Lumpur
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=10.20.30.10
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - WEBHOOK_URL=http://10.20.30.10:5678/

    volumes:
      - ./data:/home/node/.n8n

    restart: unless-stopped
